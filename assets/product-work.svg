ion</text><text x="835" y="442">→</text><text x="865" y="442">Policies</text><text x="655" y="492">Revenue</text><text x="835" y="492">→</text><text x="865" y="492">Commission</text><text x="655" y="542">QR / Pickup</text><text x="835" y="542">→</text><text x="865" y="542">User flow</text></g></g><rect x="70" y="610" width="1060" height="1" fill="#1e293b"/><text x="600" y="638" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="15">The useful lesson: a screen is only one node in a much larger product flow.</text>
