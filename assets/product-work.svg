<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Production product work map</title><desc id="desc">A visual summary of Shekhar's production work across Snibbl and Anna Travel.</desc>
