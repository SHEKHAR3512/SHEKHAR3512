<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Shekhar's frontend toolkit map</title><desc id="desc">A map of frontend, mobile, state, UI, engineering and creative technologies used by Shekhar.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="600" rx="30" fill="url(#bg)"/><text x="70" y="72" fill="#f8fafc" font-family="Arial" font-size="30" font-weight="700">TOOLKIT — BUILT AROUND PRODUCT WORK</text><text x="70" y="108" fill="#94a3b8" font-family="Arial" font-size="18">The tools change. Clear components, data flow and user experience stay important.</text><g font-family="Arial"><g transform="translate(70 155)"><rect width="330" height="160" rx="22" fill="#0b1220" stroke="#1e293b"/><rect width="8" height="160" rx="4" fill="#38bdf8"/><text x="32" y="42" fill="#7dd3fc" font-size="20" font-weight="700">CORE FRONTEND</text><text x="32" y="82" fill="#e2e8f0" font-size="18">React · TypeScript · JavaScript</text><text x="32" y="112" fill="#e2e8f0" font-size="18">HTML · CSS · Responsive UI</text><text x="32" y="140" fill="#94a3b8" font-size="15">Reusable components · architecture</text></g><g transform="translate(435 155)"><rect width="330" height="160" rx="22" fill="#0b1220" stroke="#1e293b"/><rect width="8" height="160" rx="4" fill="#818cf8"/><text x="32" y="42" fill="#a5b4fc" font-size="20" font-weight="700">STATE + DATA</text><text x="32" y="82" fill="#e2e8f0" font-size="18">Redux Toolkit · RTK Query</text><text x="32" y="112" fill="#e2e8f0" font-size="18">REST APIs · Firebase</text><text x="32" y="140" fill="#94a3b8" font-size="15">Loading · errors · cache · edge cases</text></g><g transform="translate(800 155)"><rect width="330" height="160" rx="22" fill="#0b1220" stroke="#1e293b"/><rect width="8" height="160" rx="4" fill="#22d3ee"/><text x="32" y="42" fill="#67e8f9" font-size="20" font-weight="700">UI SYSTEMS</text><text x="32" y="82" fill="#e2e8f0" font-size="18">Material UI · Core UI</text><text x="32" y="112" fill="#e2e8f0" font-size="18">Tailwind CSS · Figma</text><text x="32" y="140" fill="#94a3b8" font-size="15">Consistency · responsive behavior</text></g><g transform="translate(70 350)"><rect width="330" height="160" rx="22" fill="#0b1220" stroke="#1e293b"/><rect width="8" height="160" rx="4" fill="#34d399"/><text x="32" y="42" fill="#6ee7b7" font-size="20" font-weight="700">MOBILE</text><text x="32" y="82" fill="#e2e8f0" font-size="18">React Native · Android · iOS</text><text x="32" y="112" fill="#e2e8f0" font-size="18">Auth · OTP · location · payments</text><text x="32" y="140" fill="#94a3b8" font-size="15">Production-oriented flows</text></g><g transform="translate(435 350)"><rect width="330" height="160" rx="22" fill="#0b1220" stroke="#1e293b"/><rect width="8" height="160" rx="4" fill="#f59e0b"/><text x="32" y="42" fill="#fbbf24" font-size="20" font-weight="700">ENGINEERING</text><text x="32" y="82" fill="#e2e8f0" font-size="18">Git · GitHub · GitLab</text><text x="32" y="112" fill="#e2e8f0" font-size="18">ESLint · Prettier · Husky</text><text x="32" y="140" fill="#94a3b8" font-size="15">Debugging · tooling · releases</text></g><g transform="translate(800 350)"><rect width="330" height="160" rx="22" fill="#0b1220" stroke="#1e293b"/><rect width="8" height="160" rx="4" fill="#e879f9"/><text x="32" y="42" fill="#f0abfc" font-size="20" font-weight="700">CREATIVE FRONTEND</text><text x="32" y="82" fill="#e2e8f0" font-size="18">GSAP · WebGL · Three.js</text><text x="32" y="112" fill="#e2e8f0" font-size="18">Babylon.js · 3D · motion</text><text x="32" y="140" fill="#94a3b8" font-size="15">Interaction beyond dashboards</text></g></g></svg>