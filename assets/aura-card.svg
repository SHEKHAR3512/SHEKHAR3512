<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">AURA Music project card</title><desc id="desc">A project showcase for AURA Music featuring cinematic playback, synchronized lyrics, Jam sessions, authentication, Firebase and AI recommendations.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09090b"/><stop offset=".55" stop-color="#17122b"/><stop offset="1" stop-color="#082f49"/></linearGradient><radialGradient id="orb"><stop stop-color="#a855f7" stop-opacity=".85"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="32"/></filter></defs>
  <rect width="1200" height="540" rx="30" fill="url(#bg)"/><circle cx="950" cy="155" r="210" fill="url(#orb)" filter="url(#blur)"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="70" y="90" fill="#c084fc" font-size="18" font-weight="700" letter-spacing="4">FEATURED EXPERIMENT</text><text x="70" y="155" fill="#f8fafc" font-size="52" font-weight="800">AURA Music</text><text x="70" y="198" fill="#cbd5e1" font-size="23">A cinematic music experience built around real-time interaction.</text><g transform="translate(70 255)"><rect width="300" height="82" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/><text x="24" y="32" fill="#f0abfc" font-size="16" font-weight="700">CINEMATIC PLAYER</text><text x="24" y="59" fill="#cbd5e1" font-size="15">Dynamic visuals + synced lyrics</text></g><g transform="translate(390 255)"><rect width="300" height="82" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/><text x="24" y="32" fill="#67e8f9" font-size="16" font-weight="700">REAL-TIME JAM</text><text x="24" y="59" fill="#cbd5e1" font-size="15">WebSocket group listening</text></g><g transform="translate(710 255)"><rect width="300" height="82" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/><text x="24" y="32" fill="#93c5fd" font-size="16" font-weight="700">MULTI-PROVIDER AUTH</text><text x="24" y="59" fill="#cbd5e1" font-size="15">Google · phone OTP · email OTP</text></g><text x="70" y="400" fill="#94a3b8" font-size="16" font-weight="700">STACK</text><text x="70" y="435" fill="#e2e8f0" font-size="18">React 19 · TypeScript · Vite 8 · Tailwind CSS 4 · Zustand · TanStack Query</text><text x="70" y="468" fill="#e2e8f0" font-size="18">Express · WebSocket · Firebase · JioSaavn · LRCLIB · Gemini</text><text x="70" y="505" fill="#67e8f9" font-family="monospace" font-size="17">github.com/SHEKHAR3512/aura-music →</text></g>
</svg>