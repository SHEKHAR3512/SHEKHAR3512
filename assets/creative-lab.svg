<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">Creative frontend lab</title><desc id="desc">React, motion, WebGL, 3D and music UX experimentation</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0d1732"/></linearGradient>
  <linearGradient id="wave" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <style>.orb{animation:bob 4s ease-in-out infinite}.orb2{animation-delay:-1.2s}.orb3{animation-delay:-2.1s}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}.wave{stroke-dasharray:14 10;animation:flow 2s linear infinite}@keyframes flow{to{stroke-dashoffset:-48}}</style>
</defs>
<rect width="1100" height="360" rx="26" fill="url(#bg)"/>
<text x="55" y="58" fill="#d7e7f8" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">Experimental lab</text>
<text x="55" y="88" fill="#708cab" font-family="ui-monospace,monospace" font-size="15">where product engineering meets interaction</text>
<path d="M70 260 C170 160 250 320 360 220 S560 130 675 220 S880 320 1030 170" fill="none" stroke="url(#wave)" stroke-width="3" class="wave"/>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle" font-weight="700">
 <g class="orb"><circle cx="180" cy="170" r="48" fill="#0b2138" stroke="#38bdf8" stroke-width="2"/><text x="180" y="176" fill="#e6f5ff" font-size="17">REACT</text></g>
 <g class="orb orb2"><circle cx="370" cy="215" r="48" fill="#0b2138" stroke="#60a5fa" stroke-width="2"/><text x="370" y="221" fill="#e6f5ff" font-size="17">MOTION</text></g>
 <g class="orb orb3"><circle cx="560" cy="150" r="48" fill="#0b2138" stroke="#818cf8" stroke-width="2"/><text x="560" y="156" fill="#e6f5ff" font-size="17">WEBGL</text></g>
 <g class="orb orb2"><circle cx="750" cy="220" r="48" fill="#0b2138" stroke="#22d3ee" stroke-width="2"/><text x="750" y="226" fill="#e6f5ff" font-size="17">3D</text></g>
 <g class="orb"><circle cx="940" cy="165" r="48" fill="#0b2138" stroke="#38bdf8" stroke-width="2"/><text x="940" y="171" fill="#e6f5ff" font-size="15">MUSIC UX</text></g>
</g>
<text x="550" y="325" fill="#6f8dab" font-family="ui-monospace,monospace" font-size="15" text-anchor="middle">prototype → observe → refine → carry the lesson forward</text>
</svg>