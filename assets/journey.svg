<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Shekhar's developer journey</title>
  <desc id="desc">A visual timeline from computer engineering diploma to production frontend work and current React Native and creative frontend growth.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0f172a"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.52" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="500" rx="30" fill="url(#bg)"/>
  <g opacity=".12" stroke="#38bdf8"><path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200"/><path d="M150 0V500M300 0V500M450 0V500M600 0V500M750 0V500M900 0V500M1050 0V500"/></g>
  <text x="70" y="75" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">THE JOURNEY SO FAR</text>
  <text x="70" y="110" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="18">Learning frontend by shipping real products, not by collecting badges.</text>
  <path d="M155 270H1045" stroke="url(#line)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <g font-family="Arial, Helvetica, sans-serif"><circle cx="190" cy="270" r="22" fill="#07111f" stroke="#38bdf8" stroke-width="7"/><text x="190" y="220" text-anchor="middle" fill="#38bdf8" font-size="24" font-weight="700">2024</text><text x="190" y="330" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Computer Engineering</text><text x="190" y="360" text-anchor="middle" fill="#94a3b8" font-size="17">Diploma completed</text><circle cx="600" cy="270" r="22" fill="#07111f" stroke="#818cf8" stroke-width="7"/><text x="600" y="220" text-anchor="middle" fill="#a5b4fc" font-size="24" font-weight="700">PRODUCTION</text><text x="600" y="330" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">React + TypeScript</text><text x="600" y="360" text-anchor="middle" fill="#94a3b8" font-size="17">APIs · state · debugging · releases</text><circle cx="1010" cy="270" r="22" fill="#07111f" stroke="#22d3ee" stroke-width="7"/><text x="1010" y="220" text-anchor="middle" fill="#67e8f9" font-size="24" font-weight="700">NOW</text><text x="1010" y="330" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Web → Mobile → Creative</text><text x="1010" y="360" text-anchor="middle" fill="#94a3b8" font-size="17">React Native · architecture · motion · 3D</text></g>
  <rect x="74" y="410" width="1052" height="54" rx="14" fill="#0b1220" stroke="#1e293b"/><text x="600" y="444" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="18">UI → STATE → APIs → EDGE CASES → DEBUGGING → POLISH → RELEASE</text>
</svg>